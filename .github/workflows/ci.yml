name: CI

# Runs on main and on pull requests. Triggering on every branch push as well
# would double the minutes spent on any branch that has a PR open.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Lombok's annotation processing is version-sensitive; this matches the
          # toolchain in build.gradle.
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The starter is resolved from Maven Central, like any other dependency.
      # `bash ./gradlew` rather than `./gradlew`: the wrapper is committed without
      # the executable bit.
      - name: Test against the published starter
        run: bash ./gradlew --no-daemon test
